<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6957e8">
<title>HappyGames — Igraj brezplačno</title>
<style>
:root{--purple:#6957e8;--ink:#25233b;--muted:#77758c;--bg:#f6f5fc}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);position:sticky;top:0;z-index:5;box-shadow:0 3px 18px #29205a0b}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px;color:var(--purple)}.logo span{color:#ffb84d}
.search{width:min(330px,45vw);border:1px solid #e8e5f2;background:#faf9ff;border-radius:30px;padding:12px 17px;font-size:15px;outline:none}.search:focus{border-color:var(--purple)}
.hero{margin:28px auto 20px;width:min(1160px,92%);padding:54px 24px;border-radius:28px;color:white;text-align:center;background:radial-gradient(circle at 15% 20%,#ffffff30 0 4%,transparent 4.5%),linear-gradient(120deg,#5949d8,#a34fe4);position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 10px;letter-spacing:-1.5px}.hero p{margin:0;color:#f0eaff;font-size:17px}.hero .free{display:inline-block;margin-top:22px;background:#ffffff20;border:1px solid #ffffff55;border-radius:30px;padding:9px 16px;font-size:13px;font-weight:800}
main{width:min(1160px,92%);margin:28px auto 70px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 30px}.filters button{border:0;background:white;color:#55516d;padding:11px 17px;border-radius:30px;font-weight:750;cursor:pointer}.filters button.active,.filters button:hover{background:var(--purple);color:white}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 17px}.section-title h2{font-size:23px;margin:0}.section-title small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.game{border:0;padding:0;text-align:left;background:#fff;border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 5px 20px #30265d0b;transition:transform .18s,box-shadow .18s;color:inherit}.game:hover{transform:translateY(-5px);box-shadow:0 12px 25px #30265d18}.cover{height:145px;display:grid;place-items:center;font-size:66px}.info{padding:14px 16px 17px}.info h3{margin:0 0 5px;font-size:17px}.info p{margin:0;color:var(--muted);font-size:13px}.tag{display:inline-block;margin-top:12px;background:#f0edff;color:var(--purple);font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px}
.empty{display:none;padding:35px;text-align:center;color:var(--muted);background:white;border-radius:18px}
footer{text-align:center;padding:28px;background:#24213b;color:#d9d5ef}footer strong{color:white}
.modal{display:none;position:fixed;inset:0;background:#17132dcc;z-index:10;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:23px;padding:24px;position:relative;text-align:center}.close{position:absolute;right:15px;top:15px;border:0;border-radius:50%;width:35px;height:35px;background:#f0eef8;font-size:18px;cursor:pointer}.dialog h2{margin:5px 35px 18px}.game-area{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px}.btn{border:0;border-radius:12px;background:var(--purple);color:white;font-weight:800;padding:12px 19px;cursor:pointer}.muted{color:var(--muted);font-size:14px}
.board{display:grid;grid-template-columns:repeat(3,78px);gap:8px}.cell{height:78px;border:0;border-radius:13px;background:#f0edff;color:var(--purple);font-size:30px;font-weight:900;cursor:pointer}
.memory{display:grid;grid-template-columns:repeat(4,65px);gap:9px}.memory button{height:65px;border:0;border-radius:12px;background:#eeeaff;font-size:27px;cursor:pointer}
canvas{max-width:100%;background:#202b35;border-radius:12px;touch-action:none}
.reaction-box{width:min(360px,100%);height:130px;border-radius:16px;background:#ddd;display:grid;place-items:center;font-weight:900;cursor:pointer;user-select:none}
@media(max-width:560px){header{height:auto;padding:15px 4%;gap:12px;flex-wrap:wrap}.logo{font-size:22px}.search{width:100%;order:2}.hero{padding:42px 18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover{height:115px;font-size:55px}.info{padding:12px}.info h3{font-size:15px}}
</style>
</head>
<body>
<header><div class="logo">Happy<span>Games</span> 🎮</div><input id="search" class="search" type="search" placeholder="🔎 Išči igre ..." aria-label="Išči igre"></header>
<section class="hero"><h1>Čas je za malo zabave! 🎉</h1><p>Odkrij igre, izberi svojo najljubšo in začni igrati.</p><div class="free">★ 100 % BREZPLAČNO ZA IGRANJE</div></section>
<main>
 <div class="filters" id="filters">
  <button class="active" data-cat="Vse">🌟 Vse igre</button><button data-cat="Akcija">⚡ Akcija</button><button data-cat="Uganke">🧩 Uganke</button><button data-cat="Šport">🏀 Šport</button><button data-cat="Zabava">🎉 Zabava</button>
 </div>
 <div class="section-title"><h2>🔥 Igre za igranje</h2><small id="count"></small></div>
 <div class="grid" id="games">
  <button class="game" data-name="Kača" data-cat="Akcija" data-game="snake"><div class="cover" style="background:#d9f8e6">🐍</div><div class="info"><h3>Kača</h3><p>Ujemi čim več hrane!</p><span class="tag">AKCIJA</span></div></button>
  <button class="game" data-name="Spomin" data-cat="Uganke" data-game="memory"><div class="cover" style="background:#ffe8c9">🧠</div><div class="info"><h3>Spomin</h3><p>Najdi vse pare kart.</p><span class="tag">UGANKE</span></div></button>
  <button class="game" data-name="Križci in krožci" data-cat="Zabava" data-game="tic"><div class="cover" style="background:#e5ddff">❌</div><div class="info"><h3>Križci in krožci</h3><p>Igraj s prijateljem.</p><span class="tag">ZABAVA</span></div></button>
  <button class="game" data-name="Hitri prsti" data-cat="Zabava" data-game="reaction"><div class="cover" style="background:#ffdce8">⚡</div><div class="info"><h3>Hitri prsti</h3><p>Preizkusi svoje reflekse.</p><span class="tag">ZABAVA</span></div></button>
  <button class="game" data-name="Košarka klik" data-cat="Šport" data-game="basket"><div class="cover" style="background:#ffe5c8">🏀</div><div class="info"><h3>Košarka klik</h3><p>Zberi čim več košev.</p><span class="tag">ŠPORT</span></div></button>
  <button class="game" data-name="Barvni izziv" data-cat="Uganke" data-game="color"><div class="cover" style="background:#dceeff">🎨</div><div class="info"><h3>Barvni izziv</h3><p>Izberi pravo barvo.</p><span class="tag">UGANKE</span></div></button>
 </div><div class="empty" id="empty">Ni zadetkov. Poskusi drugo iskanje. 🙂</div>
</main>
<footer><strong>HappyGames 🎮</strong><br><small>Igre za vse. Brez plačila za igranje.</small></footer>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="gameTitle"><div class="dialog"><button class="close" id="close" aria-label="Zapri">✕</button><h2 id="gameTitle">Igra</h2><div class="game-area" id="area"></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let activeCat='Vse', cleanup=()=>{};
function filter(){const q=$('#search').value.toLocaleLowerCase('sl');let shown=0;$$('.game').forEach(g=>{const ok=g.dataset.name.toLocaleLowerCase('sl').includes(q)&&(activeCat==='Vse'||g.dataset.cat===activeCat);g.style.display=ok?'block':'none';if(ok)shown++});$('#count').textContent=shown+' iger';$('#empty').style.display=shown?'none':'block'}
$('#search').addEventListener('input',filter);
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(!b)return;activeCat=b.dataset.cat;$$('#filters button').forEach(x=>x.classList.toggle('active',x===b));filter()});
function openGame(name,fn){cleanup();$('#gameTitle').textContent=name;$('#area').innerHTML='';$('#modal').classList.add('open');cleanup=fn($('#area'))||(()=>{});}
$$('.game').forEach(g=>g.addEventListener('click',()=>openGame(g.dataset.name,({snake,memory,tic,reaction,basket,color})[g.dataset.game])));
function closeGame(){cleanup();cleanup=()=>{};$('#modal').classList.remove('open');$('#area').innerHTML=''}
$('#close').onclick=closeGame;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeGame()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGame()});
function tic(area){let b=Array(9).fill(''),p='X',done=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function draw(){area.innerHTML=`<p>${done?'Konec igre':`Na vrsti: ${p}`}</p><div class="board">${b.map((v,i)=>`<button class="cell" data-i="${i}">${v}</button>`).join('')}</div><button class="btn" id="again">Ponovi</button>`;area.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(done||b[i])return;b[i]=p;let win=wins.some(w=>w.every(n=>b[n]===p));if(win||b.every(Boolean)){done=true;draw();area.insertAdjacentHTML('afterbegin',`<b>${win?'🏆 Zmagal je '+p:'🤝 Neodločeno!'}</b>`);return}p=p==='X'?'O':'X';draw()});$('#again').onclick=()=>{b=Array(9).fill('');p='X';done=false;draw()}}draw()}
function memory(area){let vals=['🍕','🐱','🚀','⚽','🌈','🐸','🍓','🎸'];vals=[...vals,...vals].sort(()=>Math.random()-.5);let opened=[],matched=[],lock=false;function draw(){area.innerHTML=`<p>Najdeni pari: ${matched.length/2}/8</p><div class="memory">${vals.map((v,i)=>`<button data-i="${i}">${matched.includes(i)||opened.includes(i)?v:'❔'}</button>`).join('')}</div>`;area.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(lock||opened.includes(i)||matched.includes(i))return;opened.push(i);draw();if(opened.length===2){lock=true;setTimeout(()=>{if(vals[opened[0]]===vals[opened[1]])matched.push(...opened);opened=[];lock=false;draw();if(matched.length===16)area.insertAdjacentHTML('beforeend','<b>🏆 Odlično! Našel si vse pare!</b>')},650)}})}draw()}
function reaction(area){let timer=null,start=0,state='idle';area.innerHTML='<p id="rmsg">Pritisni začni. Ko polje postane zeleno, hitro klikni!</p><button class="btn" id="rstart">Začni</button><div class="reaction-box" id="rbox">Pripravljen?</div>';const box=$('#rbox'),msg=$('#rmsg'),btn=$('#rstart');btn.onclick=()=>{clearTimeout(timer);state='wait';box.style.background='#e75a5a';box.textContent='Počakaj ...';msg.textContent='Ne klikni še!';btn.disabled=true;timer=setTimeout(()=>{state='go';start=performance.now();box.style.background='#38c978';box.textContent='KLIKNI!';msg.textContent='ZDAJ!'},1200+Math.random()*2500)};box.onclick=()=>{if(state==='wait'){clearTimeout(timer);state='idle';msg.textContent='Prehitro! Poskusi znova.';box.textContent='Ups!';box.style.background='#ddd';btn.disabled=false}else if(state==='go'){let ms=Math.round(performance.now()-start);state='idle';msg.textContent=`Tvoj odzivni čas: ${ms} ms`;box.textContent='Bravo!';box.style.background='#ddd';btn.disabled=false}};return()=>clearTimeout(timer)}
function basket(area){let score=0,left=20,interval;area.innerHTML=`<h3>Točke: <span id="bs">0</span></h3><p>Čas: <span id="bt">20</span> s</p><button id="ball" style="font-size:85px;border:0;background:none;cursor:pointer">🏀</button><p id="bmsg">Klikaj žogo čim hitreje!</p>`;$('#ball').onclick=()=>{if(left<=0)return;score++;$('#bs').textContent=score};interval=setInterval(()=>{left--;$('#bt').textContent=left;if(left<=0){clearInterval(interval);$('#bmsg').textContent=`Konec! Zbral si ${score} točk.`;$('#ball').disabled=true}},1000);return()=>clearInterval(interval)}
function color(area){const colors=[{n:'RDEČA',c:'#ed5353'},{n:'MODRA',c:'#4d8df5'},{n:'ZELENA',c:'#32b879'},{n:'RUMENA',c:'#f0bd35'}];let score=0,round=0,correct;function next(){round++;if(round>10){area.innerHTML=`<h3>Konec! Tvoj rezultat: ${score}/10 🎉</h3><button class="btn" id="re">Igraj znova</button>`;$('#re').onclick=()=>{score=0;round=0;next()};return}correct=colors[Math.floor(Math.random()*4)];let choices=[...colors].sort(()=>Math.random()-.5);area.innerHTML=`<h3>Runda ${round}/10 · Točke ${score}</h3><div style="width:100px;height:75px;border-radius:14px;background:${correct.c}"></div><p>Katera barva je prikazana?</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${choices.map(c=>`<button class="btn" data-n="${c.n}">${c.n}</button>`).join('')}</div><p id="feedback"></p>`;area.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(b.dataset.n===correct.n){score++;$('#feedback').textContent='Pravilno! 🎉'}else $('#feedback').textContent='Tokrat ne. Prava barva je '+correct.n;area.querySelectorAll('[data-n]').forEach(x=>x.disabled=true);setTimeout(next,750)})}next()}
function snake(area){area.innerHTML='<p>Uporabi puščice na tipkovnici za premikanje.</p><b>Točke: <span id="ss">0</span></b><canvas id="sc" width="300" height="300"></canvas><p id="sm"></p><button class="btn" id="sr">Začni znova</button>';let timer,keys;function start(){clearInterval(timer);let c=$('#sc'),ctx=c.getContext('2d'),s=[{x:7,y:7}],d={x:1,y:0},food={x:3,y:4},score=0,alive=true;$('#ss').textContent=0;$('#sm').textContent='';function key(e){let m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}}[e.key];if(m&&!(m.x===-d.x&&m.y===-d.y)){d=m;e.preventDefault()}}window.addEventListener('keydown',key);keys=()=>window.removeEventListener('keydown',key);timer=setInterval(()=>{let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.x>=15||h.y<0||h.y>=15||s.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);keys();$('#sm').textContent='Konec igre! Rezultat: '+score;return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;$('#ss').textContent=score;do{food={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)}}while(s.some(p=>p.x===food.x&&p.y===food.y))}else s.pop();ctx.clearRect(0,0,300,300);ctx.fillStyle='#35c978';s.forEach(p=>ctx.fillRect(p.x*20+1,p.y*20+1,18,18));ctx.fillStyle='#ff6464';ctx.fillRect(food.x*20+1,food.y*20+1,18,18)},145)}$('#sr').onclick=start;start();return()=>{clearInterval(timer);if(keys)keys()}}
filter();
</script>
</body>
</html>
